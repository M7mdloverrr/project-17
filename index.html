<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad — Gold Artwork</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 30%, #2a1d08 0%, #0d0904 55%, #050302 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: #f6d77a;
    text-align: center;
  }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    letter-spacing: 6px;
    background: linear-gradient(180deg, #ffe79c, #d4a03c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 20px rgba(212,160,60,.25);
  }
  .frame {
    max-width: 480px;
    width: 100%;
    padding: 10px;
    border-radius: 16px;
    background: linear-gradient(160deg, #f6d77a, #8a5a12 55%, #f0c96a);
    box-shadow: 0 12px 50px rgba(212,160,60,.35), 0 2px 8px rgba(0,0,0,.6);
  }
  .frame img {
    display: block;
    width: 100%;
    border-radius: 8px;
  }
  p { font-size: 14px; letter-spacing: 2px; color: #b98f3e; }
  .sep { width: 140px; height: 1px; background: linear-gradient(90deg, transparent, #b98f3e, transparent); }
</style>
</head>
<body>
  <h1>MUHAMMAD</h1>
  <div class="sep"></div>
  <div class="frame"><img src="photo.png" alt="Gold artwork for Muhammad"></div>
  <p>✦ GOLD EDITION ✦</p>
</body>
</html>
